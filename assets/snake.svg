<svg xmlns="http://www.w3.org/2000/svg" width="900" height="180" viewBox="0 0 900 180">
  <rect width="900" height="180" fill="#ffffff" rx="12"/>
  <rect x="20" y="20" width="860" height="140" rx="8" fill="#f6f8fa"/>
  <text x="450" y="75" text-anchor="middle" fill="#ff0080" font-family="Segoe UI, sans-serif" font-size="20" font-weight="600">🐍 Contribution Snake Loading...</text>
  <text x="450" y="110" text-anchor="middle" fill="#586069" font-family="Segoe UI, sans-serif" font-size="14">Trigger "Generate Snake" workflow from Actions tab</text>
  <rect x="370" y="125" width="160" height="4" rx="2" fill="#ff0080">
    <animate attributeName="width" values="0;160;0" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="x" values="450;370;450" dur="2s" repeatCount="indefinite"/>
  </rect>
</svg>
